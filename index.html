<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <div id="main"> 
        <div id="main__header">
            <h3>Todo App</h3>
        </div>
        <div id="main__body">
            <div>
                <input type="text" placeholder="Add your new todo" id="input">
            </div>
            <div>
                <button id="plus">+</button>
            </div>
        </div>
        <div id="main__footer">
            <div style="text-align: center;padding: 5px 0;" id="main__footer--note">Không có bản ghi chú nào!</div>
        </div>
        <div id="main__report" style="padding: 10px 0;">
            <div><p id="text">You have 0 pending tasks</p></div>
            <div>
                <button id="clearAll">Clear All</button>
            </div>
        </div>
    </div>
    <script src="./main.js"></script>
</body>
</html>
